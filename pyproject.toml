[project]
name = "redteam"
version = "0.1.0"
description = "Multi-agent Red Teaming Framework skeleton (authorized security testing only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6",
    "langgraph>=0.2",
    "mcp>=2,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# LiteLLM currently requires Python 3.11+ (uses typing.NotRequired).
# Kept optional so the base install works on the team's current 3.10
# environments; install this extra once you're on 3.11+ to use
# redteam.llm.litellm.LiteLLMClient for real.
llm = [
    "litellm>=1.50",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
redteam = "redteam.app.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["redteam"]
ignore_missing_imports = true
disallow_untyped_defs = false
