[project]
name = "redteam"
version = "0.1.0"
description = "Multi-agent Red Teaming Framework skeleton (authorized security testing only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.6,<3.0",
    "pluggy>=1.6,<2.0",
    "jsonschema>=4.20,<5.0",
    "langgraph>=0.2",
    # Run-local checkpoint allowlists use the SDK's serde event hooks.
    "langgraph-checkpoint>=4.2,<5.0",
    "networkx==3.4.2",
    "tenacity>=9.1,<10",
    "mcp>=2,<3",
    "pyyaml>=6.0",
    "httpx>=0.28,<1",
    "anyio>=4,<5",
    # CLI output only (redteam.app.cli.*) -- never imported by core/orchestration/agents.
    "rich>=13.7,<15",
    "prompt-toolkit>=3.0,<4",
]

[project.optional-dependencies]
orchestration = [
    "langgraph>=1.2,<2.0",
    "langchain>=1.4,<2.0",
    "langchain-litellm>=0.7,<1.0",
    "langgraph-checkpoint-sqlite>=3.1,<4.0",
    "aiosqlite>=0.22,<1.0",
]
# Direct LiteLLM adapter support. The orchestration extra also installs
# LiteLLM transitively through langchain-litellm.
llm = [
    "litellm>=1.50",
]
# Everything `redteam run` actually needs for a real (non-Fake/non-Example)
# execution: a real LLM provider, and SQLite-backed checkpoint/work-ledger
# storage (`redteam run` always uses the SQLite checkpoint backend, e.g.
# for `redteam approvals approve` to be able to resume the same Run — see
# README "CLI"). Does not include dev tooling (pytest/ruff/mypy) — combine
# with `dev` for a full development setup: `pip install -e ".[dev,agent]"`.
agent = [
    "litellm>=1.50",
    "langgraph-checkpoint-sqlite>=3.1,<4.0",
    "aiosqlite>=0.22,<1.0",
]
# Local browser UI (`redteam web`). These packages are also installed
# transitively by `mcp`; they are declared here because the web UI imports them
# directly. FastAPI and a JavaScript build chain are intentionally not used.
web = [
    "starlette>=0.27",
    "uvicorn>=0.31",
    "sse-starlette>=3.0",
]
dev = [
    "langgraph-checkpoint-sqlite>=3.1,<4.0",
    "aiosqlite>=0.22,<1.0",
    "starlette>=0.27",
    "uvicorn>=0.31",
    "sse-starlette>=3.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.168",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
redteam = "redteam.app.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
redteam = ["capability/reference_data/*.json", "capability/reference_data/*.yaml", "capability/reference_data/templates/*.md", "app/web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["redteam"]
ignore_missing_imports = true
disallow_untyped_defs = false
