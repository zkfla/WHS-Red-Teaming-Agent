[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "redteaming-agent"
version = "0.1.0"
description = "Evidence-backed authorized red-teaming agent"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["litellm>=1.50"]
browser = ["playwright>=1.40"]

[project.scripts]
redteaming = "redteaming.cli:main"
redteam = "redteam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
