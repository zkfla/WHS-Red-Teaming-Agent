[project]
name = "redteam"
version = "0.1.0"
description = "Multi-agent Red Teaming Framework skeleton (authorized security testing only)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.6",
    "jsonschema>=4.20,<5.0",
    "langgraph>=0.2",
    "mcp>=2,<3",
    "pyyaml>=6.0",
    "httpx>=0.28,<1",
    "anyio>=4,<5",
]

[project.optional-dependencies]
orchestration = [
    "langgraph>=1.2,<2.0",
    "langchain>=1.4,<2.0",
    "langchain-litellm>=0.7,<1.0",
    "langchain-mcp-adapters>=0.3,<1.0",
    "langgraph-checkpoint-sqlite>=3.1,<4.0",
    "aiosqlite>=0.22,<1.0",
]
# Direct LiteLLM adapter support. The orchestration extra also installs
# LiteLLM transitively through langchain-litellm.
llm = [
    "litellm>=1.50",
]
dev = [
    "langgraph-checkpoint-sqlite>=3.1,<4.0",
    "aiosqlite>=0.22,<1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.168",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
redteam = "redteam.app.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
packages = ["redteam"]
ignore_missing_imports = true
disallow_untyped_defs = false
