[project]
name = "finredteam"
version = "0.1.0"
description = "FinRedTeam - authorized black-box red-teaming agent for vuln-bank"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "rich>=13.7",
    "pyyaml>=6.0",
    "networkx>=3.2",
    "anthropic>=0.34",
    "openai>=1.40",
]

# 명령어 하나로 실행: `pip install -e .` 후
#   finredteam --target vulnbank --fake-llm
#   finredteam-replay latest
#   finredteam-scorer runs/<run_id>
[project.scripts]
finredteam = "finredteam.__main__:main"
finredteam-replay = "finredteam.replay:main"
finredteam-scorer = "finredteam.evaluator.scorer:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["finredteam*"]
