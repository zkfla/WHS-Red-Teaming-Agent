# ★ 두 번째로 빠뜨렸던 tool. 이것도 실제 요청을 보낸다.
#
#   "정상 동작이 어떤 모양인지"를 실측하는 tool 이다. 공격이 아니라 기준선 측정이지만,
#   진짜 송금을 한 번 실행하므로 정책 대상이다. 이 측정값이 있어야
#   expected_delta.provenance 가 baseline_observed 가 되고, 오라클이 판정에 쓸 수 있다.
id: learn_baseline
version: 1
layer: finance
summary: 정상 파라미터로 한 번 실행해 그 연산의 실측 기준선을 만든다.

capabilities:
  required: [state_change]
  concurrency: 1
  max_amount_touched: "10.00"   # 타깃 설정의 normal_params.amount (vulnbank: 10)
  request_budget: 4

effects:
  creates_resource_types: []
  mutates_balance: true
  reversible: false
  repeatable: false             # 같은 op 을 두 번 배울 이유가 없다

preconditions:
  - kind: principal
    attrs: {has_account: true}
    count: 2                    # 송금 기준선은 보내는 쪽 + 받는 쪽이 필요하다
    bind: pair

postconditions: []

params:
  op:
    type: string
    description: 타깃 설정의 baseline_ops 에 있는 연산 이름
    required: true

# ★ 이 tool 이 건드릴 것으로 선언한 표면 — control plane 이 실행 후 대조한다.
surface:
  - {method: POST, path: "/transfer", note: "정상 파라미터 1회"}
  - {method: GET, path: "/check_balance/{id}", note: "전/후 관측"}

failure_modes:
  - {code: baseline_failed, expected: true, description: "기준선 측정 실패 — 이 연산은 판정 근거 부족"}
