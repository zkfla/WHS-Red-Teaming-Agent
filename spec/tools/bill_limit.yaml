# ★ biller(discovered) 를 전제로 갖는다 → discover_biller 가 먼저 돌아야 한다.
#   그 순서가 코드가 아니라 그래프에서 나온다.
id: bill_limit
version: 1
layer: finance
summary: 청구서 결제에 음수/최소금액 미만을 보내도 수락되는지 본다.

capabilities:
  required: [state_change]
  concurrency: 1
  max_amount_touched: "100.00"
  request_budget: 2

effects:
  creates_resource_types: [bill_payment]
  mutates_balance: true
  reversible: false
  repeatable: true

preconditions:
  - kind: principal
    attrs: {has_account: true}
    bind: payer
  - kind: biller
    attrs: {discovered: true, min_amount_known: true}
    bind: biller

postconditions: []

params:
  negative_amount:
    type: money
    default: "-100.00"

# ★ 이 tool 이 건드릴 것으로 선언한 표면 — control plane 이 실행 후 대조한다.
surface:
  - {method: GET, path: "/api/bill-categories", note: "biller 탐색"}
  - {method: GET, path: "/api/billers/by-category/{id}", note: "서버 선언 경계 획득"}
  - {method: POST, path: "/api/bill-payments/create", note: "경계 위반 금액"}

failure_modes:
  - {code: biller_not_found, expected: true, description: "실존 biller 없음 — 서버 선언 경계 확보 실패"}
cleanup_impossible_reason: "청구서 결제는 취소 API 가 없다 — 생성된 결제 건은 되돌릴 수 없다"
