id: cancel_loan
version: 1
layer: finance
summary: 시험 중 생성한 대출 요청을 취소한다.
capabilities: {required: [state_change, delete], concurrency: 1, max_amount_touched: null, request_budget: 2}
effects: {creates_resource_types: [], mutates_balance: false, reversible: false, repeatable: true}
surface_binding: target
preconditions:
  - {kind: endpoint, attrs: {reachable: true}, bind: target, from_param: target}
  - {kind: loan, bind: loan, from_param: loan}
postconditions: []
params:
  target: {type: string, required: true, binds_to: endpoint}
  loan:   {type: string, required: true, binds_to: loan}
mcp: {expose: false, server: finredteam-web}   # 정리는 control plane 이 부른다
failure_modes:
  - {code: cancel_unsupported, expected: true, description: "취소 API 없음 — 정리 불가로 정직하게 기록"}
