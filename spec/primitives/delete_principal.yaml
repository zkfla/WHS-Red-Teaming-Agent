# 정리 전용 tool. create_principal 이 만든 계정을 되돌린다.
# ★ 이런 tool 이 없으면 "만들기만 하고 못 치우는" 구조가 된다 — 검사기 ⑬ 가 그걸 막는다.
id: delete_principal
version: 1
layer: generic
summary: 시험 중 만든 테스트 계정을 삭제한다.
capabilities: {required: [state_change, delete], concurrency: 1, max_amount_touched: null, request_budget: 2}
effects: {creates_resource_types: [], mutates_balance: false, reversible: false, repeatable: true}
surface_binding: target
preconditions:
  - {kind: endpoint, attrs: {reachable: true}, bind: target, from_param: target}
  - {kind: principal, bind: victim_of_cleanup, from_param: principal}
postconditions: []
params:
  target:    {type: string, required: true, binds_to: endpoint}
  principal: {type: string, required: true, binds_to: principal}
mcp: {expose: false, server: finredteam-web}   # ★ 정리는 control plane 이 부른다, 모델이 아니라
failure_modes:
  - {code: delete_unsupported, expected: true, description: 대상이 삭제 API 를 제공하지 않음 — 정리 불가로 정직하게 기록}
