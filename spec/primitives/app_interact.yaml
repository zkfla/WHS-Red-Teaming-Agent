# 모바일 조작 — http_request 의 앱 버전.
#
# ★ 정찰로 **발견한 화면**만 건드릴 수 있다. surface_binding 이 가리키는 값이
#   그래프에 실존하는 screen 노드여야 하므로, 없는 화면을 지어낼 수 없다.
#   웹에서 http_request 가 endpoint 에 묶이는 것과 같은 구조다.
id: app_interact
version: 1
layer: generic
summary: 이미 발견한 앱 화면에서 탭·입력·인텐트 같은 동작을 수행한다.
capabilities: {required: [state_change], concurrency: 1, max_amount_touched: "1000.00", request_budget: 5}
effects: {creates_resource_types: [], mutates_balance: true, reversible: false, repeatable: true}

surface_binding: target
preconditions:
  - {kind: screen, attrs: {reachable: true}, bind: target, from_param: target}
  - {kind: principal, attrs: {authenticated: true}, bind: actor, optional: true}
postconditions: []
# 어느 화면을 치느냐에 따라 달라진다 — 웹의 http_request 와 같은 이유로 종류만 선언한다.
may_produce: [screen, token, account, card]

params:
  target: {type: string, description: 그래프에 실존하는 screen 노드 id, required: true, binds_to: screen}
  action: {type: string, enum: [tap, input, swipe, intent], default: tap}
  # ★ sensitive — 로그인 화면에 넣는 값이 그대로 기록에 남으면 안 된다
  value:  {type: string, description: 입력하거나 전달할 값, sensitive: true}
  amount: {type: money, description: 금액 입력 필드가 있으면 여기로 분리, policy_checked: true}

mcp: {expose: true, server: finredteam-mobile, hide_when_unavailable: true}
failure_modes:
  - {code: screen_not_found, expected: true,  description: 화면 전이 실패 — 흐름이 바뀜}
  - {code: app_crashed,      expected: false, description: 앱이 죽음 — 누적되면 중단 검토}
