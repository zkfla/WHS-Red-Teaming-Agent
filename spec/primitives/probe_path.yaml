# 정찰 — 유일하게 "모르는 곳"을 칠 수 있는 tool. 그래서 읽기 전용으로 묶는다.
#
# ★ layer 를 meta 에서 generic 으로 옮겼다. 이 tool 은 **네트워크를 탄다** —
#   meta 로 둔 탓에 검사기 ⑨(표면 선언)와 ingest 의 표면 대조가 통째로 면제돼 있었다.
#   하필 LLM 이 준 문자열이 그대로 요청이 되는 유일한 tool 이 그 예외였다.
#   "네트워크를 타는가" 는 분류가 아니라 사실이므로 이제 offline 필드로 따로 적는다.
id: probe_path
version: 1
layer: generic
summary: 아직 모르는 경로를 읽기 전용으로 찔러 존재 여부를 확인한다.
capabilities: {required: [], concurrency: 1, max_amount_touched: null, request_budget: 1}
effects: {creates_resource_types: [], mutates_balance: false, reversible: true, repeatable: true}
# ★ 정확한 경로는 미리 못 적는다(모르는 곳을 찾는 게 목적이다). 대신 울타리를 적는다.
#   engagement 정책(StaticPolicy.allowed_path_prefixes)이 이 울타리를 더 좁힌다 —
#   승인 범위보다 넓은 울타리를 선언하면 check_manifest 가 tool 전체를 차단한다.
surface_prefixes:
  - {methods: [GET, HEAD, OPTIONS], path_prefix: "/", note: "대상 호스트 전체를 읽기 전용으로만"}
preconditions: []
postconditions:
  - {kind: endpoint, attrs: {reachable: true}}
params:
  path:   {type: string, description: 찔러볼 경로, required: true}
  method: {type: string, enum: [GET, HEAD, OPTIONS], default: GET}

mcp: {expose: true, server: finredteam-recon, hide_when_unavailable: false,
      annotations: {readOnlyHint: "true"}}
failure_modes:
  - {code: not_found, expected: true, description: 경로 없음 — 정상적인 탐색 결과}
