# 토큰 위조. 네트워크를 안 탄다 — 만든 토큰을 http_request 에 실어야 비로소 시험이 된다.
# 그래서 이 tool 자체는 surface 가 없고 layer 가 meta 다.
id: forge_token
version: 1
layer: meta
# ★ 표면 선언 의무가 면제되는 유일한 근거. 예전에는 layer=="meta" 가 그 대용이었는데,
#   probe_path 도 meta 라서 정찰 tool 이 통째로 스코프 검사 밖으로 나가 있었다.
offline: true
summary: 임의 클레임으로 토큰을 위조한다. 흔한 약한 서명키 사전을 시도한다.
capabilities: {required: [bruteforce], concurrency: 1, max_amount_touched: null, request_budget: 0}
effects: {creates_resource_types: [], mutates_balance: false, reversible: true, repeatable: true}
preconditions:
  - {kind: token, attrs: {valid: true}, bind: reference}
postconditions:
  - {kind: token, attrs: {forged: true}}
params:
  claims: {type: json, description: 덮어쓸 클레임. 권한 상승 시도 지점, sensitive: true}
  alg:    {type: string, enum: [HS256, none], default: HS256}

mcp: {expose: true, server: finredteam-crypto, hide_when_unavailable: true,
      annotations: {readOnlyHint: "true"}}   # 네트워크를 안 탄다 — 토큰만 만든다
failure_modes:
  - {code: no_weak_secret, expected: true, description: 사전에 맞는 시크릿 없음 — 서명키가 강함}
