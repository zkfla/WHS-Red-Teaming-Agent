name: Operator-approved synthetic two-user lab
description: Only synthetic accounts and exact operator-approved paths
scope:
  allowed_hosts: [127.0.0.1]
execution_budget:
  max_actions: 20
  max_tool_calls: 20
  max_duration_seconds: 300
rate_limit_policy:
  max_actions_per_minute: 10
  max_concurrent_actions: 1
approval_policy:
  auto_approve: false
  require_approval_for: [web.http_request, web.response_analysis]
