engagement:
  name: Synthetic financial MCP integration lab
  scope:
    allowed_hosts: [mock-bank]
  metadata:
    target_refs:
      mock-bank: bank-lab
      # The observed HTTP endpoint is pinned to the declared policy origin.
      mock-bank:8080: bank-lab
  execution_budget:
    max_actions: 30
    max_tool_calls: 30
    max_duration_seconds: 300
  rate_limit_policy:
    max_actions_per_minute: 10
    max_concurrent_actions: 1
  approval_policy:
    auto_approve: false
    require_approval_for:
      - web.http_request
      - web.auth_attempt
      - web.parameter_fuzz
      - web.response_analysis
      - recon.port_scan
capability:
  mcp_servers: [web-http, web-proxy, web-browser, recon-passive, recon-active]
llm:
  # Production requires a real model: provider + model/key must come from
  # environment (REDTEAM_LLM_PROVIDER=litellm, REDTEAM_LLM_MODEL, LLM_API_KEY).
  # 'fake' is rejected by the real-model builder; tests inject their
  # scripted stand-in explicitly and never rely on this file.
  provider: litellm
  default_model: gpt-4o-mini
  api_key_env_var: LLM_API_KEY
logging:
  level: WARNING
