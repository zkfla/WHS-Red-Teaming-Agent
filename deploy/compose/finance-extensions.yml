# Overlay on finance-lab.yml. Synthetic credentials and isolated network only.
services:
  zap-engine:
    image: zaproxy/zap-stable:2.16.1@sha256:7840969c7c9fead565bf9734b12f49f6886db90b1d35b1f74d79710bbd081dab
    command: [zap.sh, -daemon, -host, 0.0.0.0, -port, "8090", -config, api.key=synthetic-zap-key, -config, api.addrs.addr.name=.*, -config, api.addrs.addr.regex=true]
    networks: [lab]
    read_only: true
    tmpfs: [/tmp, "/home/zap/.ZAP:uid=1000,gid=1000", "/home/zap/.java:uid=1000,gid=1000"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/JSON/core/view/version/?apikey=synthetic-zap-key',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 30

  web-zap:
    build:
      context: ../..
      dockerfile: deploy/docker/finance-tools/Dockerfile
      target: base
    command: [web-zap, --policy, /app/policy.json, --zap-api-origin, http://zap-engine:8090, --transport, streamable-http, --host, 0.0.0.0]
    environment:
      ZAP_API_KEY: synthetic-zap-key
    volumes:
      - ../mcp/finance/policy.json:/app/policy.json:ro
    networks: [lab]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      zap-engine:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1',8000),2).close()"]
      interval: 3s
      timeout: 3s
      retries: 15

  web-nuclei:
    build:
      context: ../..
      dockerfile: deploy/docker/finance-tools/Dockerfile
      target: nuclei
    command: [web-nuclei, --policy, /app/policy.json, --transport, streamable-http, --host, 0.0.0.0]
    volumes:
      - ../mcp/finance/policy.json:/app/policy.json:ro
    networks: [lab]
    read_only: true
    tmpfs: [/tmp, "/home/mcp:uid=10001,gid=10001"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      mock-bank:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import socket; socket.create_connection(('127.0.0.1',8000),2).close()"]
      interval: 3s
      timeout: 3s
      retries: 15

  extensions-smoke:
    build:
      context: ../..
      dockerfile: deploy/docker/finance-tools/Dockerfile
      target: base
    profiles: [test]
    entrypoint: [python, /app/extensions_smoke.py]
    env_file:
      - ../mcp/finance/framework.env.example
      - ../mcp/finance/extensions.env.example
    volumes:
      - ../../examples/finance_extensions_smoke.py:/app/extensions_smoke.py:ro
    networks: [lab]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      web-http:
        condition: service_healthy
      web-zap:
        condition: service_healthy
      web-nuclei:
        condition: service_healthy
