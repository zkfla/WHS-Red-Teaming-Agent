site_name: WHS Red Teaming Agent
site_description: 가설 수립부터 실행과 증거 관리까지 연결하는 AI 보안 점검 시스템 기술 문서
site_url: https://zkfla.github.io/WHS-Red-Teaming-Agent/
repo_url: https://github.com/zkfla/WHS-Red-Teaming-Agent
repo_name: zkfla/WHS-Red-Teaming-Agent
edit_uri: edit/docs-site/website/docs/
copyright: Copyright &copy; 2026 WHS Red Teaming Agent

theme:
  name: material
  language: ko
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - 개요: index.md
  - 배경: background.md
  - 들어가기 전에: concepts.md
  - 한 번의 점검 따라가기: walkthrough.md
  - 아키텍처: architecture.md
  - 도메인 계약: contracts.md
  - 실행 모델: orchestration.md
  - 실행 통제 (Control Plane): control-plane.md
  - Capability 계층: capability.md
  - 상태와 운영자 개입: state.md
  - 증거와 검증: evidence.md
  - 레퍼런스: reference.md
