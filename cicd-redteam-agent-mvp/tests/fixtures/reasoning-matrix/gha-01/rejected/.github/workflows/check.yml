name: Input propagation rejected
on: pull_request
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - id: capture
        env:
          COMMAND: ${{ github.event.pull_request.title }}
        run: echo "payload=${COMMAND}" >> "$GITHUB_OUTPUT"
      - env:
          COMMAND: ${{ steps.capture.outputs.payload }}
        run: |
          case "$COMMAND" in
            lint|test) bash -c "$COMMAND" ;;
            *) exit 1 ;;
          esac
