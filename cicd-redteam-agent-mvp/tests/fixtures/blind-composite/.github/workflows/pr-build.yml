name: Community build
on: pull_request
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Build through repository action
        uses: ./actions/package
      - uses: actions/cache@1111111111111111111111111111111111111111
        with:
          path: .venv
          key: shared-release-v1
      - uses: actions/upload-artifact@2222222222222222222222222222222222222222
        with:
          name: release-bundle
          path: dist
