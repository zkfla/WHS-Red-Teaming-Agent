name: Inference flow secure
on: pull_request
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Validate input without interpretation
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          case "$PR_TITLE" in
            safe|reviewed) printf '%s\n' "$PR_TITLE" ;;
            *) exit 1 ;;
          esac
