name: Deploy
on:
  workflow_run:
    workflows: [PR build]
    types: [completed]
permissions:
  contents: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@0123456789abcdef0123456789abcdef01234567
        with:
          name: deployment
          path: incoming
          run-id: ${{ github.event.workflow_run.id }}
      - name: Execute deployment artifact
        run: bash incoming/deploy.sh
      - uses: aws-actions/configure-aws-credentials@0123456789abcdef0123456789abcdef01234567
        with:
          role-to-assume: arn:aws:iam::123456789012:role/deploy
          aws-region: us-east-1
