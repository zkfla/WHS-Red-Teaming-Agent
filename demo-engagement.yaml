# Minimal example Engagement config for the vertical slice.
# Loaded by redteam.app.bootstrap.load_engagement.

name: "Example Engagement"
description: "Authorized test engagement used to validate the framework skeleton."

scope:
  allowed_hosts:
    - "example.local"
  allowed_domains: []
  allowed_networks: []
  denied_hosts: []

rules_of_engagement:
  # ROE is now enforced by redteam.control.roe. This prototype rule sets
  # no restrictions so the vertical slice runs at any time / timezone.
  # To exercise enforcement, add denied_capabilities/denied_operations
  # (canonical "<capability>.<operation>" keys), allowed_* lists, or
  # start_at/end_at/allowed_time_windows — see docs/contracts/actions.md.
  - name: "prototype-open"
    description: "No restrictions; keeps the demo green regardless of clock."

execution_budget:
  max_actions: 5
  max_tool_calls: 5
  max_duration_seconds: 300

rate_limit_policy:
  max_actions_per_minute: 30
  max_concurrent_actions: 1

approval_policy:
  require_approval_for: []
  auto_approve: false

metadata:
  owner: "pm"
