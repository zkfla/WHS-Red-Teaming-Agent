<title>실행 구조 비교 도식</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">

<style>
  :root {
    --page:   #F4F5F3;
    --card:   #FFFFFF;
    --ink:    #14161A;
    --ink-2:  #4A4F58;
    --muted:  #858A93;
    --rule:   #D8DAD5;
    --accent: #4E9E38;   /* 경량화 = 선택한 구조 */
    --slow:   #9AA0A8;   /* 기존 구조 */
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page:   #101215;
      --card:   #191C21;
      --ink:    #ECEEF0;
      --ink-2:  #B9BEC6;
      --muted:  #868C95;
      --rule:   #2C3037;
      --accent: #74C25A;
      --slow:   #6E747C;
    }
  }
  :root[data-theme="dark"] {
    --page:   #101215;
    --card:   #191C21;
    --ink:    #ECEEF0;
    --ink-2:  #B9BEC6;
    --muted:  #868C95;
    --rule:   #2C3037;
    --accent: #74C25A;
    --slow:   #6E747C;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 30px 20px 44px;
    background: var(--page); color: var(--ink);
    font-family: "Noto Sans KR", -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; }
  .card {
    background: var(--card); border: 1px solid var(--rule);
    padding: 26px 30px 22px;
  }
  h1 {
    font-size: 18px; font-weight: 700; margin: 0 0 4px;
    letter-spacing: -.01em;
  }
  .sub { font-size: 13px; color: var(--ink-2); margin: 0 0 22px; }
  figure { margin: 0; }
  svg { width: 100%; max-width: 100%; height: auto; display: block; }
  figcaption {
    font-size: 12.5px; color: var(--ink-2); margin-top: 16px;
    line-height: 1.8; border-top: 1px solid var(--rule); padding-top: 13px;
  }
  figcaption b { color: var(--ink); font-weight: 700; }
</style>

<div class="wrap">
  <div class="card">
    <h1>순차 실행 → 병렬 투입</h1>
    <p class="sub">실행 시간의 97%가 LLM 응답 대기 — 대기를 겹치게 만드는 것이 구조 변경의 핵심</p>

    <figure>
      <svg viewBox="0 0 860 400" role="img"
           aria-label="기존 순차 구조는 정찰·공격·보고 세 단계가 차례로 대기해 775초가 걸리고, 경량화 구조는 담당이 다른 다섯 에이전트가 동시에 대기해 70초에 끝난다">
        <defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="currentColor"/>
          </marker>
          <marker id="ar-a" viewBox="0 0 10 10" refX="9" refY="5"
                  markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#4E9E38"/>
          </marker>
        </defs>

        <!-- ══ 기존 (순차) ══ -->
        <text x="0" y="16" font-size="13" font-weight="700" fill="currentColor">기존 — 순차 실행</text>
        <text x="0" y="34" font-size="11.5" fill="var(--muted)">앞 단계가 끝나야 다음이 시작 · 대기가 차례로 쌓임</text>

        <!-- 3단계 체인 -->
        <g stroke="var(--slow)" fill="none" stroke-width="1.4">
          <rect x="0"   y="54" width="150" height="46" rx="3"/>
          <rect x="196" y="54" width="150" height="46" rx="3"/>
          <rect x="392" y="54" width="150" height="46" rx="3"/>
        </g>
        <g font-size="12.5" fill="currentColor" text-anchor="middle">
          <text x="75"  y="74">정찰</text>
          <text x="271" y="74">공격</text>
          <text x="467" y="74">보고</text>
        </g>
        <g font-size="10.5" fill="var(--muted)" text-anchor="middle" font-family="JetBrains Mono, monospace">
          <text x="75"  y="91">10턴</text>
          <text x="271" y="91">20턴</text>
          <text x="467" y="91">4턴</text>
        </g>
        <!-- 연결 화살표 -->
        <g stroke="var(--slow)" stroke-width="1.4" color="#9AA0A8">
          <line x1="150" y1="77" x2="190" y2="77" marker-end="url(#ar)"/>
          <line x1="346" y1="77" x2="386" y2="77" marker-end="url(#ar)"/>
        </g>
        <g font-size="10" fill="var(--muted)" text-anchor="middle">
          <text x="170" y="70">끝나야</text>
          <text x="366" y="70">끝나야</text>
        </g>

        <!-- 총 시간 -->
        <line x1="0" y1="118" x2="542" y2="118" stroke="var(--slow)" stroke-width="1"/>
        <line x1="0" y1="113" x2="0" y2="123" stroke="var(--slow)" stroke-width="1"/>
        <line x1="542" y1="113" x2="542" y2="123" stroke="var(--slow)" stroke-width="1"/>
        <text x="271" y="136" font-size="12" font-weight="700" text-anchor="middle"
              fill="currentColor" font-family="JetBrains Mono, monospace">775초</text>

        <!-- 구분선 -->
        <line x1="0" y1="166" x2="860" y2="166" stroke="var(--rule)" stroke-width="1"/>

        <!-- ══ 경량화 (병렬) ══ -->
        <text x="0" y="196" font-size="13" font-weight="700" fill="#4E9E38">경량화 — 병렬 투입</text>
        <text x="0" y="214" font-size="11.5" fill="var(--muted)">담당이 다른 에이전트가 동시에 대기 · 정찰 단계 제거</text>

        <!-- 타깃 -->
        <rect x="0" y="256" width="72" height="40" rx="3"
              stroke="currentColor" fill="none" stroke-width="1.4"/>
        <text x="36" y="281" font-size="12" text-anchor="middle" fill="currentColor">타깃</text>

        <!-- 분기 화살표 -->
        <g stroke="#4E9E38" stroke-width="1.4" fill="none" color="#4E9E38">
          <path d="M 72 276 L 100 276 L 100 240 L 128 240" marker-end="url(#ar-a)"/>
          <path d="M 100 276 L 100 262 L 128 262" marker-end="url(#ar-a)"/>
          <path d="M 100 276 L 128 276" marker-end="url(#ar-a)"/>
          <path d="M 100 276 L 100 290 L 128 290" marker-end="url(#ar-a)"/>
          <path d="M 100 276 L 100 312 L 128 312" marker-end="url(#ar-a)"/>
        </g>

        <!-- 전문가 5 -->
        <g stroke="#4E9E38" fill="none" stroke-width="1.4">
          <rect x="134" y="228" width="196" height="24" rx="3"/>
          <rect x="134" y="250" width="196" height="24" rx="3"/>
          <rect x="134" y="272" width="196" height="24" rx="3"/>
          <rect x="134" y="294" width="196" height="24" rx="3"/>
          <rect x="134" y="316" width="196" height="24" rx="3"/>
        </g>
        <g font-size="11.5" fill="currentColor">
          <text x="146" y="244">injection · 주입</text>
          <text x="146" y="266">access · 접근제어</text>
          <text x="146" y="288">authn · 인증/세션</text>
          <text x="146" y="310">exposure · 정보노출</text>
          <text x="146" y="332">logic · 비즈니스 로직</text>
        </g>
        <g font-size="10" fill="var(--muted)" text-anchor="end" font-family="JetBrains Mono, monospace">
          <text x="322" y="244">9턴</text>
          <text x="322" y="266">9턴</text>
          <text x="322" y="288">9턴</text>
          <text x="322" y="310">9턴</text>
          <text x="322" y="332">9턴</text>
        </g>

        <!-- 동시 진행 표시 -->
        <line x1="126" y1="228" x2="126" y2="340" stroke="#4E9E38" stroke-width="1.4"/>
        <text x="119" y="288" font-size="10.5" fill="#4E9E38" text-anchor="end">동시</text>

        <!-- 수렴 -->
        <g stroke="#4E9E38" stroke-width="1.4" fill="none" color="#4E9E38">
          <path d="M 330 240 L 358 240 L 358 276" />
          <path d="M 330 262 L 358 262" />
          <path d="M 330 276 L 386 276" marker-end="url(#ar-a)"/>
          <path d="M 330 290 L 358 290" />
          <path d="M 330 312 L 358 312 L 358 276" />
        </g>

        <!-- 보고 -->
        <rect x="392" y="256" width="96" height="40" rx="3"
              stroke="#4E9E38" fill="none" stroke-width="1.4"/>
        <text x="440" y="275" font-size="12" text-anchor="middle" fill="currentColor">결과 통합</text>
        <text x="440" y="289" font-size="10" text-anchor="middle" fill="var(--muted)"
              font-family="JetBrains Mono, monospace">+ 보고 4턴</text>

        <!-- 총 시간 -->
        <line x1="0" y1="360" x2="488" y2="360" stroke="#4E9E38" stroke-width="1"/>
        <line x1="0" y1="355" x2="0" y2="365" stroke="#4E9E38" stroke-width="1"/>
        <line x1="488" y1="355" x2="488" y2="365" stroke="#4E9E38" stroke-width="1"/>
        <text x="244" y="378" font-size="12" font-weight="700" text-anchor="middle"
              fill="#4E9E38" font-family="JetBrains Mono, monospace">70초 · 11.1배 단축</text>

        <!-- 우측 설명 -->
        <text x="530" y="240" font-size="11.5" fill="var(--ink-2)">순차는 대기가 더해지고</text>
        <text x="530" y="260" font-size="11.5" fill="var(--ink-2)">병렬은 대기가 겹친다</text>
        <text x="530" y="292" font-size="11.5" fill="var(--ink-2)">각자 대화가 분리돼</text>
        <text x="530" y="312" font-size="11.5" fill="var(--ink-2)">누적 재전송도 사라짐</text>
        <text x="530" y="336" font-size="11.5" font-weight="700" fill="#4E9E38">토큰 3,849K → 556K</text>
      </svg>

      <figcaption>
        기존 구조는 정찰·공격·보고가 <b>차례로 대기</b>해 시간이 더해진다.
        경량화 구조는 담당이 다른 다섯 에이전트가 <b>동시에 대기</b>하므로,
        가장 오래 걸린 하나의 시간만 든다. 각자 대화 기록이 분리돼
        도구 출력이 한 대화에 누적되는 문제도 함께 해소된다.
      </figcaption>
    </figure>
  </div>
</div>
