# evaluator/ground_truth.yaml
#
# 사람이 vuln-bank(Commando-X/vuln-bank) 소스를 직접 검토해 확인한 취약점 목록.
# 에이전트는 이 파일을 절대 읽지 않는다(§9 — Black-box 위반) — evaluator/scorer.py
# 만 읽는다. endpoint 는 "{id}" 로 식별자 세그먼트를 정규화해 적는다.

- id: VB-001
  layer: finance
  attack_class: F2
  endpoint: "POST /transfer"
  description: 음수 금액 송금 시 부호가 반전되어 발신자 잔액이 오히려 증가한다.
  invariant: INV-1B
  severity: HIGH

- id: VB-002
  layer: finance
  attack_class: F1
  endpoint: "GET /check_balance/{id}"
  description: 인증 없이 임의 계좌번호의 잔액·사용자명을 조회할 수 있다 (BOLA).
  invariant: INV-2
  severity: HIGH

- id: VB-003
  layer: generic
  attack_class: G-SQLI
  endpoint: "GET /check_balance/{id}"
  description: account_number 파라미터가 SQL 문자열에 그대로 보간되어 boolean-based injection 이 가능하다.
  invariant: null
  severity: CRITICAL

- id: VB-004
  layer: generic
  attack_class: G-SQLI
  endpoint: "GET /transactions/{id}"
  description: 동일한 SQLi 가 존재하고, 에러 발생 시 원본 쿼리와 DB 에러 메시지까지 응답에 노출된다.
  invariant: null
  severity: CRITICAL

- id: VB-005
  layer: finance
  attack_class: F4
  endpoint: "POST /transfer"
  description: 잔액 확인과 차감 사이에 원자성이 없어(소스 주석에 명시) 동시 요청 시 초과 인출 가능성이 있다.
  invariant: INV-1C
  severity: HIGH

- id: VB-006
  layer: finance
  attack_class: F3
  endpoint: "POST /api/v1/payments/charge"
  description: merchant_order_id 로 멱등성·재시도 방지가 전혀 없어 동일 결제가 반복 처리될 수 있다.
  invariant: INV-4
  severity: MEDIUM

- id: VB-007
  layer: finance
  attack_class: F2
  endpoint: "POST /api/virtual-cards/{id}/fund"
  description: mass assignment 로 클라이언트가 exchange_rate 를 직접 지정해 환전 비율을 조작할 수 있다.
  invariant: INV-1B
  severity: HIGH

- id: VB-008
  layer: generic
  attack_class: G-JWT
  endpoint: "POST /login"
  description: JWT 서명 키가 하드코딩된 약한 값(secret123)이고 만료(exp) 클레임이 없다.
  invariant: null
  severity: CRITICAL

- id: VB-009
  layer: finance
  attack_class: F1
  endpoint: "POST /register"
  description: mass assignment 로 회원가입 시 is_admin 등 임의 필드를 함께 주입할 수 있다.
  invariant: INV-2
  severity: CRITICAL

- id: VB-010
  layer: finance
  attack_class: F8
  endpoint: "GET /check_balance/{id}"
  description: 계좌번호가 짧은 숫자열로 예측 가능해 보이며, 남용 통제 없이 열거로 타 계좌 정보를 수집할 수 있다.
  invariant: INV-9
  severity: MEDIUM
