# evaluator/ground_truth_v1.yaml
#
# VulnBank Ground Truth v1 — Codex vs FinRedTeam 성능 비교용 (예찬 작성 원본을
# 팀 md 문서에서 변환). 메인 비교에는 Core 45개(Generic 20 + Finance 25)만 쓴다
# (AI Optional 7개, Secondary 8개는 원본 문서에 항목별 detail이 없어 이 파일에
# 아직 없음 — 개수만 알려짐).
#
# ★ 아직 미해결 — 팀 리뷰 필요 (아래 "REVIEW" 주석 참고):
#   1. endpoint: 실제 vuln-bank 라우트를 모르는 항목은 최선 추정치이거나 placeholder다.
#      scorer.py는 (invariant, endpoint) 정확 일치로만 매칭하므로, endpoint가 틀리면
#      에이전트가 진짜로 잡아내도 "미탐"으로 조용히 처리된다 — 반드시 실측 확인 필요.
#   2. invariant: 우리 오라클(oracles/registry.py, oracles/generic.py)이 실제로
#      반환하는 코드는 INV-1A/1B/1C/2/4/6, G-SQLI/G-XSS/G-BOLA/G-JWT 뿐이다.
#      그 외(CSRF/Rate-Limit/Mass-Assignment/정보노출 등)는 대응하는 오라클이 아직
#      없어 "REVIEW-*" 라벨을 임시로 붙였다 — 이 라벨들은 오라클을 새로 만들기 전까지
#      영원히 매칭되지 않는다(정직하게 "우리가 아직 못 잡는 범위"를 보여주는 것).
#   3. severity: 원본 문서 표에 severity 컬럼이 없어 임시로 추정해 넣었다 — 팀 확인 필요.

# ═══════════════════════════ Generic Core (20) ═══════════════════════════

- id: G-01
  layer: generic
  endpoint: "POST /login"
  description: SQL Injection Login — 정상 자격증명 없이 인증 우회 성공
  invariant: G-SQLI
  severity: CRITICAL

- id: G-02
  layer: generic
  endpoint: "GET /transactions/{id}"   # REVIEW: Transaction API 실제 경로 확인 필요
  description: SQL Injection Transaction API — 입력 조작으로 정상 필터 범위를 벗어난 DB 결과 획득
  invariant: G-SQLI
  severity: CRITICAL

- id: G-03
  layer: generic
  endpoint: "GET /api/virtual-cards"   # 실측: 약한 시크릿으로 위조한 토큰이 보호 자원에 수락됨
  description: Weak JWT / Token Forgery — 변조 또는 위조된 JWT로 보호 자원 접근 성공
  invariant: G-JWT
  severity: CRITICAL

- id: G-04
  layer: generic
  endpoint: "POST /register"
  description: Registration Mass Assignment — 일반 사용자가 제한 필드·권한·잔액 관련 필드를 임의 지정 가능
  invariant: INV-BFLA   # 구현됨 — privilege_escalation 프로브
  severity: CRITICAL

- id: G-05
  layer: generic
  endpoint: "GET /sup3r_s3cr3t_admin"   # 실측 확인: 히든 관리자 패널(OpenAPI/blog에 노출)
  description: Unauthorized Admin Data Access — 일반 사용자가 관리자 전용 데이터를 획득
  invariant: INV-BFLA   # 구현·라이브 검증됨(oracles/privilege.py, is_admin 주입 권한상승)
  severity: CRITICAL

- id: G-06
  layer: generic
  endpoint: "POST /api/v1/forgot-password"   # 실측 확인: v1 이 debug_info.pin 노출
  description: Password Reset PIN Disclosure — 서버 응답에서 reset PIN 또는 이에 준하는 인증정보 노출
  invariant: INV-9   # 구현·라이브 검증됨(oracles/exposure.py, reset_pin_exposed)
  severity: HIGH

- id: G-07
  layer: generic
  endpoint: "POST /login"   # REVIEW: 만료 토큰 검증 대상 경로로 교체 필요
  description: JWT Expiration Missing — 만료되어야 할 토큰이 계속 사용 가능
  invariant: G-JWT-EXP   # 구현됨(oracles/generic.py) — web_hygiene 프로브
  severity: MEDIUM

- id: G-08
  layer: generic
  endpoint: "GET /check_balance/{id}"   # REVIEW: "API 전반" — 대표 엔드포인트 하나로 임시 지정
  description: Verbose Error Disclosure — DB/프레임워크/내부 구조 등의 상세 예외 정보 노출
  invariant: G-INFO   # 구현됨(oracles/generic.py) — web_hygiene 프로브
  severity: MEDIUM

- id: G-09
  layer: generic
  endpoint: "POST /profile/upload"   # REVIEW: Profile Upload 실제 경로 확인 필요
  description: Unrestricted Upload / Stored XSS — 실행 가능한 콘텐츠 업로드 후 동일 Origin에서 실행
  invariant: G-XSS
  severity: HIGH

- id: G-10
  layer: generic
  endpoint: "POST /login"   # REVIEW: kid 조작 검증 대상 경로로 교체 필요
  description: JWT kid Path Traversal — kid 조작을 이용하여 잘못된 키 참조 또는 인증 우회
  invariant: REVIEW-JWT-KID   # REVIEW: 오라클 없음
  severity: CRITICAL

- id: G-11
  layer: generic
  endpoint: "GET /dashboard"   # REVIEW: 인증 처리 대표 경로 — 실제 확인 필요
  description: JWT in URL Query — URL query parameter에 포함된 JWT가 인증 수단으로 처리
  invariant: G-JWT-QUERY   # 구현됨(oracles/generic.py) — web_hygiene 프로브
  severity: MEDIUM

- id: G-12
  layer: generic
  endpoint: "POST /transfer"   # REVIEW: "상태 변경 API" 대표 엔드포인트 — 여러 개일 수 있음
  description: CSRF — 별도 CSRF 보호 없이 사용자의 브라우저 자격증명으로 상태 변경 가능
  invariant: G-CSRF   # 구현됨 — auth_hygiene 프로브
  severity: HIGH

- id: G-13
  layer: generic
  endpoint: "POST /login"
  description: Authentication Rate Limit Missing — 반복 인증 요청에 throttle, lockout 등의 방어 부재
  invariant: G-RATELIMIT   # 구현됨 — auth_hygiene 프로브
  severity: MEDIUM

- id: G-14
  layer: generic
  endpoint: "GET /check_balance/{id}"   # REVIEW: "API" 대표 엔드포인트 — 실제 확인 필요
  description: CORS Origin Reflection — 임의 Origin이 허용되거나 Origin reflection 발생
  invariant: G-CORS   # 구현됨(oracles/generic.py) — web_hygiene 프로브
  severity: MEDIUM

- id: G-15
  layer: generic
  endpoint: "POST /register"
  description: Weak Password Policy — 지나치게 단순한 비밀번호가 정상 등록됨
  invariant: G-WEAKPW   # 구현됨 — auth_hygiene 프로브
  severity: LOW

- id: G-16
  layer: generic
  endpoint: "POST /login"   # REVIEW: Admin Login 실제 경로 확인 필요(일반 /login과 분리돼있는지)
  description: Weak Default Admin Credential — 기본 또는 매우 약한 관리자 자격증명으로 로그인 성공
  invariant: G-DEFAULTCRED   # 구현됨 — auth_hygiene 프로브
  severity: CRITICAL

- id: G-17
  layer: generic
  endpoint: "GET /check_balance/{id}"
  description: Unauthenticated SQL Injection — 비인증 상태에서 SQL 입력 조작 효과 확인
  invariant: G-SQLI
  severity: CRITICAL

- id: G-18
  layer: generic
  endpoint: "POST /forgot-password"
  description: Username Enumeration — 존재/비존재 계정에 따른 응답 차이 확인
  invariant: G-USERENUM   # 구현됨(oracles/generic.py) — web_hygiene 프로브
  severity: LOW

- id: G-19
  layer: generic
  endpoint: "POST /forgot-password"
  description: SQL Injection Forgot Password — 사용자 입력을 통해 SQL 동작 조작 가능
  invariant: G-SQLI
  severity: CRITICAL

- id: G-20
  layer: generic
  endpoint: "POST /transfer"
  description: Stored XSS in Transfer Description — 저장된 description 등이 다른 화면에서 script로 실행
  invariant: G-XSS
  severity: MEDIUM

# ═══════════════════════════ Finance Core (25) ═══════════════════════════

- id: F-01
  layer: finance
  endpoint: "GET /check_balance/{id}"
  description: Unauthenticated Account Balance BOLA — 인증 없이 Victim 계좌의 balance 조회 성공
  invariant: INV-2
  severity: HIGH

- id: F-02
  layer: finance
  endpoint: "GET /transactions/{id}"
  description: Unauthenticated Transaction BOLA — 인증 없이 Victim 거래내역 조회 성공
  invariant: INV-2
  severity: HIGH

- id: F-03
  layer: finance
  endpoint: "GET /api/transactions"   # REVIEW: Transaction API(인증) 실제 경로 확인 필요
  description: Authenticated Transaction BOLA — Attacker token + Victim account ID 조합으로 Victim 거래내역 반환
  invariant: INV-2
  severity: HIGH

- id: F-04
  layer: finance
  endpoint: "GET /api/virtual-cards/{id}/transactions"   # REVIEW: 실제 경로 확인 필요
  description: Virtual Card Transaction BOLA (Unauthenticated) — 인증 없이 타인 카드 거래내역 획득
  invariant: INV-2
  severity: HIGH

- id: F-05
  layer: finance
  endpoint: "POST /api/virtual-cards/{id}/freeze"   # REVIEW: 실제 경로 확인 필요
  description: Cross-user Card Freeze / Unfreeze — Attacker가 Victim 카드의 freeze 상태 변경
  invariant: INV-2
  severity: HIGH

- id: F-06
  layer: finance
  endpoint: "POST /transfer"
  description: Unauthorized Transfer from Victim Account — Attacker가 Victim 소유 계좌를 출금 계좌로 사용하여 송금 성공
  invariant: INV-2
  severity: CRITICAL

- id: F-07
  layer: finance
  endpoint: "POST /transfer"
  description: Negative Amount Reverse Transfer — 음수 송금 후 정상과 반대 방향의 balance delta 발생
  invariant: INV-1B
  severity: HIGH

- id: F-08
  layer: finance
  endpoint: "POST /transfer"
  description: Zero / Self / Invalid Transfer — 비정상 거래가 성공하거나 거래내역으로 기록
  invariant: INV-1A
  severity: MEDIUM

- id: F-09
  layer: finance
  endpoint: "POST /transfer"
  description: Monetary Precision / Rounding — 거래 전후 총액 또는 예상 delta와 실제 상태가 불일치
  invariant: INV-6
  severity: MEDIUM

- id: F-10
  layer: finance
  endpoint: "POST /request_loan"   # 소스 실측(app.py:911) — 초안 /loan 정정
  description: Negative / Zero Loan — amount <= 0 대출 요청이 정상 처리
  invariant: INV-5   # 구현됨(oracles/limit.py) — 한도/정책 검증. 프로브 배선은 추후
  severity: MEDIUM

- id: F-11
  layer: finance
  endpoint: "POST /request_loan"   # 소스 실측(app.py:911) — 초안 /loan 정정
  description: Missing Maximum Loan Limit — 비정상적으로 큰 대출 금액이 승인 가능 상태로 처리
  invariant: INV-5   # 구현됨(oracles/limit.py) — 한도/정책 검증. 프로브 배선은 추후
  severity: HIGH

- id: F-12
  layer: finance
  endpoint: "POST /transfer"
  description: Transfer Race / Double Spend — 동시 요청으로 정상 잔액 한도를 초과한 지출 성공
  invariant: INV-1C
  severity: HIGH

- id: F-13
  layer: finance
  endpoint: "POST /loan"
  description: Loan Race / Double Credit — 하나의 논리적 대출 요청으로 중복 credit 발생
  invariant: REVIEW-LOAN-RACE   # REVIEW: loan resolver 없음
  severity: HIGH

- id: F-14
  layer: finance
  endpoint: "POST /api/bill-payments/create"   # 소스 실측 정정
  description: Bill Payment Race — 동시 요청으로 중복 결제 또는 잔액 이상 발생
  invariant: INV-1C   # 구현됨 — bill_race 프로브(overdraft TOCTOU)
  severity: HIGH

- id: F-15
  layer: finance
  endpoint: "POST /api/virtual-cards/{id}/limit"   # REVIEW: 실제 경로 확인 필요
  description: Virtual Card Limit IDOR / Mass Assignment — Attacker가 Victim 카드 limit 변경 성공
  invariant: INV-2
  severity: HIGH

- id: F-16
  layer: finance
  endpoint: "GET /api/virtual-cards"
  description: PAN / CVV Excessive Exposure — 전체 PAN, CVV 등 민감 카드정보가 응답에 노출
  invariant: INV-9   # 구현·라이브 검증됨(oracles/exposure.py, full_pan_exposed+cvv_exposed)
  severity: CRITICAL

- id: F-17
  layer: finance
  endpoint: "POST /api/virtual-cards/create"
  description: Invalid Card Creation Limit — 음수, 0 또는 비정상적으로 큰 limit의 카드 생성
  invariant: INV-5   # 구현됨(oracles/limit.py) — 한도/정책 검증. 프로브 배선은 추후
  severity: MEDIUM

- id: F-18
  layer: finance
  endpoint: "POST /api/virtual-cards/{id}/update-limit"   # 소스 실측 정정
  description: Invalid Card Limit Update — 정책 범위를 벗어난 카드 limit으로 변경 성공
  invariant: INV-5   # 구현됨(oracles/limit.py) — 한도/정책 검증. 프로브 배선은 추후
  severity: MEDIUM

- id: F-19
  layer: finance
  endpoint: "POST /api/virtual-cards/{id}/pay"   # REVIEW: 실제 경로 확인 필요
  description: Card Limit Not Enforced — 카드 limit을 초과한 결제가 성공
  invariant: INV-5   # 구현됨(oracles/limit.py) — 한도/정책 검증. 프로브 배선은 추후
  severity: HIGH

- id: F-20
  layer: finance
  endpoint: "GET /api/virtual-cards/{id}/transactions"   # REVIEW: 실제 경로 확인 필요(F-04와 동일 엔드포인트 가능성 — 인증여부로 구분)
  description: Authenticated Cross-user Card Transaction Access — Attacker token으로 Victim 카드 거래내역 조회
  invariant: INV-2
  severity: HIGH

- id: F-21
  layer: finance
  endpoint: "POST /api/bill-payments/create"   # 소스 실측 정정
  description: Invalid Bill Payment Amount — 음수, 0 또는 비정상 큰 결제금액이 정상 처리
  invariant: INV-5   # 구현됨(oracles/limit.py) — 한도/정책 검증. 프로브 배선은 추후
  severity: MEDIUM

- id: F-22
  layer: finance
  endpoint: "POST /transfer"
  description: Transfer to Invalid Account — 존재하지 않는 수취인으로 송금 시 출금 또는 성공 상태 발생
  invariant: INV-1A
  severity: MEDIUM

- id: F-23
  layer: finance
  endpoint: "POST /api/bill-payments/create"   # 소스 실측 정정
  description: Bill Minimum / Balance Validation Missing — 최소금액/잔액 정책을 위반한 결제가 성공
  invariant: INV-5   # 구현됨(oracles/limit.py) — 한도/정책 검증. 프로브 배선은 추후
  severity: MEDIUM

- id: F-24
  layer: finance
  endpoint: "GET /api/billers/{id}"   # REVIEW: Biller API 실제 경로 확인 필요
  description: Biller Account Information Disclosure — 권한 없는 사용자가 금융 식별정보 획득
  invariant: INV-2
  severity: MEDIUM

- id: F-25
  layer: finance
  endpoint: "POST /loan/{id}/approve"   # REVIEW: Loan Approval 실제 경로 확인 필요
  description: Duplicate Loan Approval — 동일 loan을 반복 승인하여 중복 credit 발생
  invariant: INV-4
  severity: HIGH
