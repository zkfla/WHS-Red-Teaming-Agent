# Default candidate-planner/common-worker assembly for new CLI and web Runs.
# These deployment selectors can be narrowed/replaced through the existing profile
# selection contract; they never grant scope or execution permission.
# Split-stage v3 default (planner + distinct atomizer). Single-stage v3 compat for
# old Runs/tests lives in native-probes-legacy.yaml (compat only, not a feature).
schema_version: '3'
profile_id: native-probes
version: '24'
common: {path: prompts/common.md, version: '2', contract_version: '1'}
probe_limits: {max_actions: 4, max_model_requests: 16}
max_instances: 2
max_activations: 8
max_tasks_per_strategy: 8
max_strategy_revisions: 4
roles:
  - definition:
      agent_id: conversation
      role: conversation
      name: Operator liaison
      schedulable: false
      provider_id: specialist:conversation
      capabilities: []
      tool_selection: {}
      context_profile: {profile_id: conversation}
    prompt: {path: prompts/conversation.md, version: '1'}
  - definition:
      agent_id: planner
      role: hypothesis_planning
      name: Candidate planner
      schedulable: false
      provider_id: specialist:strategy
      capabilities: []
      tool_selection: {}
      context_profile: {profile_id: hypothesis_planning}
    prompt: {path: prompts/hypothesis-strategy.md, version: '13'}
  - definition:
      agent_id: probe-atomizer
      role: atomization
      name: Probe task atomizer
      schedulable: false
      provider_id: specialist:atomization
      capabilities: []
      tool_selection: {}
      context_profile: {profile_id: atomization}
    prompt: {path: prompts/probe-atomizer.md, version: '6'}
  - definition:
      agent_id: probe-worker
      role: probe_execution
      name: Common verification worker
      provider_id: native:probe
      capabilities: [web, api, recon, mobile, analysis]
      tool_selection: {capability_tags: [web, api, recon, mobile, analysis]}
      context_profile: {profile_id: probe_execution}
    prompt: {path: prompts/worker.md, version: '11'}
  - definition:
      agent_id: research-evidence
      role: research_evidence
      name: Independent evidence reviewer
      schedulable: false
      provider_id: specialist:research_evidence
      capabilities: []
      tool_selection: {}
      context_profile: {profile_id: research_evidence}
    prompt: {path: prompts/evidence.md, version: '3'}
  - definition:
      agent_id: code-author
      role: code_artifact
      name: Reproduction artifact author
      schedulable: false
      provider_id: specialist:code_artifact
      capabilities: []
      tool_selection: {}
      context_profile: {profile_id: code_artifact}
    prompt: {path: prompts/code.md, version: '2'}
stages:
  hypothesis_planning: planner
  task_atomization: probe-atomizer
  native_action: probe-worker
  conversation_decide: conversation
  analysis_verify: research-evidence
  analysis_claim_verify: research-evidence
  task_completion_review: research-evidence
  goal_completion_review: research-evidence
  terminal_criteria_review: research-evidence
  completion_review: research-evidence
  code_generation: code-author
  code_review: research-evidence
