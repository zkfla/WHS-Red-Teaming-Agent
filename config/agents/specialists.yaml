# Explicit opt-in P0 serial profile. Tool selection stays in the role manifest.
profile_id: specialists-serial
version: "1"
schema_version: "1"
prompt_root: prompts
common: {path: common.md, version: "1", contract_version: "1"}
max_tasks_per_question: 6
stages:
  attack_path_proposal: attack-path-planner
  task_atomization: task-atomizer
  path_review: research-evidence-agent
  next_action: attack-path-planner
  completion_review: research-evidence-agent
  task_completion_review: research-evidence-agent
  goal_completion_review: research-evidence-agent
  conversation_decide: conversation-agent
  analysis_verify: research-evidence-agent
  analysis_claim_verify: research-evidence-agent
roles:
  - definition:
      agent_id: conversation-agent
      role: conversation-agent
      name: conversation-agent
      description: Decision/artifact seam; no direct target execution
      contract_version: "1"
      schedulable: false
      capabilities: []
      provider_id: specialist:conversation-agent
      context_profile: {profile_id: "conversation-agent:v1"}
      max_concurrency: 1
    prompt: {path: conversation.md, version: "1", contract_version: "1"}
  - definition:
      agent_id: attack-path-planner
      role: attack-path-planner
      name: attack-path-planner
      description: Decision/artifact seam; no direct target execution
      contract_version: "1"
      schedulable: false
      capabilities: []
      provider_id: specialist:attack-path-planner
      context_profile: {profile_id: "attack-path-planner:v1"}
      max_concurrency: 1
    prompt: {path: attack-path-planner.md, version: "1", contract_version: "1"}
  - definition:
      agent_id: task-atomizer
      role: task-atomizer
      name: task-atomizer
      description: Decision/artifact seam; no direct target execution
      contract_version: "1"
      schedulable: false
      capabilities: []
      provider_id: specialist:task-atomizer
      context_profile: {profile_id: "task-atomizer:v1"}
      max_concurrency: 1
    prompt: {path: task-atomizer.md, version: "1", contract_version: "1"}
  - definition:
      agent_id: web-execution-agent
      role: web-execution-agent
      name: web-execution-agent
      description: Delegated target executor
      contract_version: "1"
      schedulable: true
      capabilities: ["web","api","recon"]
      provider_id: specialist:web-execution-agent
      context_profile: {profile_id: "web-execution-agent:v1"}
      max_concurrency: 1
