name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      # Synthetic workspace/VDB inputs must satisfy the same private-file
      # policy as runtime inputs; do not relax that policy for Linux CI.
      - run: |
          umask 077
          pytest -q
      - run: ruff check src tests examples deploy/docker/mcp-example/server.py deploy/docker/finance-mock/server.py
      - run: mypy src/redteam tests
      - run: docker compose -f deploy/compose/docker-compose.yml config -q
      - run: docker compose -f deploy/compose/finance-lab.yml config -q

  llm-protocols:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,agent,llm]" "litellm>=1.104.0"
      - name: Require the SDK in this protocol verification job
        run: python -c "import litellm"
      - name: Check SDK wire formats, request ownership and connection recovery offline
        shell: bash
        run: |
          umask 077
          python -m pytest -q \
          tests/unit/test_llm_opencode_go.py \
          tests/unit/test_config_opencode_go.py \
          tests/unit/test_request_scope.py \
          tests/unit/test_llm_connection_fingerprint.py \
          tests/integration/test_llm_connection_resume.py \
          tests/unit/test_llm_chatgpt_streaming.py \
          tests/unit/test_llm_native_tools.py \
          tests/unit/test_llm_usage.py \
          tests/unit/test_shared_llm_requests.py \
          tests/unit/test_run_execution_ownership.py

  mcp-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f deploy/compose/docker-compose.yml build mcp-example

  finance-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - run: docker compose -f deploy/compose/finance-lab.yml up --build -d --wait --wait-timeout 120
      - name: Exercise five MCP services against the synthetic bank
        run: docker compose -f deploy/compose/finance-lab.yml run --build --rm smoke
      - name: Exercise default Agent loop and approval gate over real MCP
        run: docker compose -f deploy/compose/finance-lab.yml run --build --rm agent-smoke
      - name: Capture container logs on failure
        if: failure()
        run: docker compose -f deploy/compose/finance-lab.yml logs --tail 100
      - name: Stop lab
        if: always()
        run: docker compose -f deploy/compose/finance-lab.yml down
