name: Deploy docs site

on:
  push:
    branches: [dev]
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment token
        env:
          GH_PAGES_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
        run: |
          if [ -z "$GH_PAGES_TOKEN" ]; then
            echo "::error::Set the GH_PAGES_TOKEN repository secret as described in website/README.md."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # GITHUB_TOKEN pushes do not trigger branch-based Pages builds.
          token: ${{ secrets.GH_PAGES_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - name: Publish site to gh-pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdocs gh-deploy --strict --remote-branch gh-pages --message 'docs: 사이트 빌드 갱신 ({sha})'
        working-directory: website
