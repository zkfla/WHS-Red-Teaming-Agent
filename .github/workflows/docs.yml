name: Deploy docs site

on:
  workflow_dispatch:
  push:
    branches: [docs-site]
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"
      - "README.md"
  pull_request:
    branches: [docs-site]
    paths:
      - "website/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r website/requirements.txt
      - run: python -m mkdocs build --strict --config-file website/mkdocs.yml
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/site

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/docs-site'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
